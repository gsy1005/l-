name: 部署美元流动性监测面板

on:
  push:
    branches: [main]
  schedule:
    # 每天 21:40 UTC 左右重新抓取源站数据并重新部署
    - cron: "40 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Python 依赖
        run: pip install beautifulsoup4 lxml

      - name: 抓取源站并整页汉化为静态站点
        run: python scripts/build_static.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: static-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
